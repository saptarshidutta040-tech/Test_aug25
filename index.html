<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      background: linear-gradient(135deg, #e87fd4 0%, #b89fd8 30%, #90b8d8 60%, #7dd4c8 100%);
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      padding: 60px 50px 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- User Icon ---------- */
    .user-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
    }

    .user-icon svg {
      width: 100%;
      height: 100%;
    }

    /* ---------- Title ---------- */
    .login-title {
      font-size: 2.4rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 0.12em;
      margin-bottom: 48px;
    }

    /* ---------- Form ---------- */
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1.5px solid rgba(75, 110, 145, 0.55);
      padding-bottom: 10px;
    }

    .input-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      color: #4a6f8a;
      opacity: 0.85;
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: #4a6f8a;
      letter-spacing: 0.04em;
    }

    .input-group input::placeholder {
      color: #5a7f9a;
      opacity: 0.8;
    }

    /* ---------- Options Row ---------- */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -4px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #4a6f8a;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      user-select: none;
    }

    /* Custom checkbox */
    .remember-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #4a6f8a;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.2s;
    }

    .remember-label input[type="checkbox"]:checked {
      background: #4a6f8a;
      border-color: #4a6f8a;
    }

    .remember-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .forgot-link {
      font-size: 0.88rem;
      font-style: italic;
      color: #4a6f8a;
      text-decoration: none;
      letter-spacing: 0.02em;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 1;
    }

    /* ---------- Login Button ---------- */
    .login-btn {
      width: 100%;
      padding: 18px;
      background: #4a6f8a;
      color: #ffffff;
      border: none;
      border-radius: 2px;
      font-family: 'Raleway', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #3b5c75;
    }

    .login-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="login-container">

    <!-- User Icon -->
    <div class="user-icon">
      <svg viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="32" cy="22" r="12" />
        <path d="M8 56c0-13.255 10.745-24 24-24s24 10.745 24 24" />
      </svg>
    </div>

    <!-- Title -->
    <h1 class="login-title">User Login</h1>

    <!-- Form -->
    <form class="form" id="login-form" novalidate>

      <!-- Email -->
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="M2 7l10 7 10-7" />
        </svg>
        <input
          id="email"
          type="email"
          placeholder="Email ID"
          autocomplete="email"
          required
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
      </div>

      <!-- Remember me / Forgot password -->
      <div class="options-row">
        <label class="remember-label" for="remember">
          <input type="checkbox" id="remember" checked />
          Remember me
        </label>
        <a href="#" class="forgot-link" id="forgot-password-link">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="login-btn" id="login-btn">Login</button>

    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;
      // Placeholder: wire up to your auth backend here
      console.log('Login attempted:', { email });
    });
  </script>

</body>
</html>
